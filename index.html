<!DOCTYPE html>
<html>
<head>
    <title>QR Code Generator</title>
    <script src="qrcode.min.js"></script> <!-- local file -->
</head>

<body style="font-family:Arial; text-align:center; padding:40px;">

    <h2>QR Code Generator</h2>

    <!-- Input box -->
    <input type="text" id="text" placeholder="Enter URL or text" style="width:300px; padding:10px;">
    
    <br><br>

    <!-- Button -->
    <button onclick="generateQR()" style="padding:10px 20px;">Generate</button>

    <br><br>

    <!-- QR output -->
    <div id="qrcode"></div>

<script>
function generateQR() {
    document.getElementById("qrcode").innerHTML = ""; // clear old QR

    new QRCode(document.getElementById("qrcode"), {
        text: document.getElementById("text").value,
        width: 200,
        height: 200
    });
}
</script>

</body>
</html>
