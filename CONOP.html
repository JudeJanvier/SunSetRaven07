<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOC | CONOP DASHBOARD</title>

<style>
:root {
  --bg:#0a0c0e;
  --panel:#111827;
  --card:#0f1720;
  --border:#2b3440;
  --accent:#d4af37;
  --text:#c9d1d9;
}

*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI, monospace;background:var(--bg);color:var(--text);display:grid;grid-template-columns:280px 1fr;height:100vh}

.sidebar{background:#0f172a;border-right:2px solid var(--border);padding:15px}
.mission-tab{border:1px solid var(--border);padding:10px;margin-bottom:6px;cursor:pointer}
.mission-tab.active{border-color:var(--accent);background:rgba(212,175,55,0.1)}

.main{padding:15px;overflow:auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.title{font-size:1.6rem;border:1px solid var(--accent);padding:6px 15px}

.slide{display:none;grid-template-columns:25% 50% 25%;gap:12px}
.slide.active{display:grid}

.section{
  border:1px solid var(--border);
  background:var(--card);
  padding:10px;
  cursor:grab;
}
.section.dragging{opacity:0.5}
.section-title{
  color:var(--accent);
  font-size:0.8rem;
  border-bottom:1px solid var(--border);
  margin-bottom:6px;
  padding-bottom:4px;
  display:flex;justify-content:space-between;align-items:center;
}

.delete-btn{color:red;cursor:pointer;font-weight:bold}

.box{
  background:#1a2230;
  border:1px solid var(--accent);
  padding:8px;
}

.left,.right{display:flex;flex-direction:column;gap:10px}
.center{display:flex;flex-direction:column;gap:10px}

.map{
  height:300px;
  border:2px dashed var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  cursor:pointer;
}
.map img{width:100%;height:100%;object-fit:contain}

.timeline{
  border:1px solid var(--border);
  padding:10px;
  background:#0d1117;
}

button{background:#111827;border:1px solid var(--border);color:white;padding:6px 10px;cursor:pointer}
.editing [contenteditable="true"]{outline:1px dashed var(--accent)}
</style>
</head>

<body>

<div class="sidebar">
  <div id="tabs"></div>
  <button onclick="addMission()">+ Add Mission</button>
</div>

<div class="main">
  <div class="header">
    <div>LOGO</div>
    <div class="title" contenteditable="true">CONOP TITLE</div>
    <div>DTG / LOCATION</div>
  </div>

  <button onclick="toggleEdit()">Edit Mode</button>

  <div id="slides"></div>
</div>

<template id="template">
<div class="slide">

<div class="left">

</div>

<div class="center">

<div class="map" onclick="triggerUpload(this)">
<span>CLICK TO UPLOAD MAP</span>
<img class="img">
<input type="file" hidden onchange="uploadImg(event,this)">
</div>

<div class="timeline">
<div class="section-title">OPERATIONAL TIMELINE</div>
<div class="timeline-list editable" contenteditable="false"></div>
<div style="margin-top:8px; display:flex; gap:6px; flex-wrap:wrap;">
<input type="time" class="time-input">
<input type="text" class="task-input" placeholder="Task">
<button onclick="addTimelineItem(this)">Add</button>
</div>
</div>

</div>

<div class="right">

</div>

</div>
</template>

<script>
let count=0
let edit=false
let dragSrc=null

function createSection(title="NEW SECTION", content="Type..."){
  const section=document.createElement('div')
  section.className='section'
  section.draggable=true

  section.innerHTML=`
  <div class="section-title" contenteditable="true">${title}<span class="delete-btn" onclick="deleteSection(this)">×</span></div>
  <div class="box editable" contenteditable="false">${content}</div>
  `

  section.addEventListener('dragstart',()=>{
    dragSrc=section
    section.classList.add('dragging')
  })

  section.addEventListener('dragend',()=>{
    section.classList.remove('dragging')
  })

  section.addEventListener('dragover',(e)=>{
    e.preventDefault()
    const container=section.parentElement
    const after=getDragAfterElement(container,e.clientY)
    if(after==null) container.appendChild(dragSrc)
    else container.insertBefore(dragSrc,after)
  })

  return section
}

function getDragAfterElement(container,y){
  const elements=[...container.querySelectorAll('.section:not(.dragging)')]
  return elements.reduce((closest,child)=>{
    const box=child.getBoundingClientRect()
    const offset=y-box.top-box.height/2
    if(offset<0 && offset>closest.offset){
      return {offset:offset,element:child}
    }else return closest
  },{offset:Number.NEGATIVE_INFINITY}).element
}

function deleteSection(btn){
  btn.closest('.section').remove()
}

function addMission(name="Mission"){
count++
let id="m"+count

let tab=document.createElement('div')
tab.className='mission-tab'
tab.innerText=name

tab.onclick=()=>switchMission(id,tab)
document.getElementById('tabs').appendChild(tab)

let temp=document.getElementById('template').content.cloneNode(true)
let slide=temp.querySelector('.slide')
slide.id=id

// default sections
let left=slide.querySelector('.left')
left.appendChild(createSection("MISSION STATEMENT","Type mission..."))
left.appendChild(createSection("COMMANDER'S INTENT","Type intent..."))

let right=slide.querySelector('.right')
right.appendChild(createSection("CONCEPT OF OPERATIONS","Phase I"))

// add buttons
let addLeftBtn=document.createElement('button')
addLeftBtn.innerText='+ Add Section'
addLeftBtn.onclick=()=>left.appendChild(createSection())
left.appendChild(addLeftBtn)

let addRightBtn=document.createElement('button')
addRightBtn.innerText='+ Add Section'
addRightBtn.onclick=()=>right.appendChild(createSection())
right.appendChild(addRightBtn)


document.getElementById('slides').appendChild(slide)

switchMission(id,tab)
}

function switchMission(id,tab){
document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'))
document.querySelectorAll('.mission-tab').forEach(t=>t.classList.remove('active'))

document.getElementById(id).classList.add('active')
tab.classList.add('active')
}

function toggleEdit(){
edit=!edit

document.querySelectorAll('.editable').forEach(e=>e.contentEditable=edit)
}

function triggerUpload(mapEl){
const input=mapEl.querySelector('input')
input.click()
}

function uploadImg(e,input){
let file=e.target.files[0]
if(!file) return
let reader=new FileReader()
reader.onload=r=>{
input.closest('.map').querySelector('.img').src=r.target.result
}
reader.readAsDataURL(file)
}

function addTimelineItem(btn){
const container = btn.closest('.timeline')
const time = container.querySelector('.time-input').value
const task = container.querySelector('.task-input').value

if(!time || !task) return

const list = container.querySelector('.timeline-list')
let items = list.innerHTML.split('<br>').filter(i=>i.trim()!="")
items.push(`${time} ${task}`)
items.sort((a,b)=>a.localeCompare(b))
list.innerHTML = items.join('<br>')

container.querySelector('.time-input').value=""
container.querySelector('.task-input').value=""
}

window.onload=()=>{
addMission('EPFA')
addMission('AFT')
}
</script>

</body>
</html>
