<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOC | MISSION BUILDER PRO</title>

<style>
:root {
--bg:#0a0c0e;--panel:#161b22;--border:#30363d;--accent:#d4af37;--army-green:#4b5320;--text:#c9d1d9;--danger:#f85149;
}

body{margin:0;font-family:"Segoe UI","Courier New",monospace;background:var(--bg);color:var(--text);display:grid;grid-template-columns:300px 1fr;height:100vh}

.sidebar{background:var(--panel);border-right:2px solid var(--border);padding:20px;display:flex;flex-direction:column}
.tab-list{flex-grow:1;overflow:auto}
.mission-tab{border:1px solid var(--border);padding:10px;margin-bottom:5px;cursor:pointer;display:flex;gap:5px;align-items:center}
.mission-tab.active{border-color:var(--accent);background:rgba(212,175,55,0.1)}

.status-dot{width:10px;height:10px;border-radius:50%}
.green{background:#16a34a}
.amber{background:#f59e0b}
.red{background:#dc2626}

.main{padding:20px;overflow:auto}
.header{display:flex;justify-content:space-between;margin-bottom:10px}
.banner{background:var(--danger);padding:5px 15px}

.unit-box{margin-bottom:10px;border:1px solid var(--border);padding:10px}

.slide{display:none;background:black;border:2px solid var(--border);grid-template-columns:28% 44% 28%;min-height:800px}
.slide.active{display:grid}

.col{border-right:1px solid var(--border);padding:10px}
.col:last-child{border-right:none}

.map{height:350px;background:#111;display:flex;justify-content:center;align-items:center;position:relative}
.map img{width:100%;height:100%;object-fit:contain}

.editing [contenteditable="true"]{outline:1px dashed var(--accent)}

</style>
</head>

<body>

<div class="sidebar">
<div id="tabs" class="tab-list"></div>
<button onclick="addMission()">+ Add Mission</button>
<button onclick="exportPDF()">Export PDF</button>
</div>

<div class="main">
<div class="header">
<div class="banner">FOUO</div>
<div>
<button onclick="toggleEdit()">Edit</button>
<button onclick="toggleFullscreen()">Brief</button>
</div>
</div>

<!-- UNIT TRACKING -->
<div class="unit-box" contenteditable="true">
<strong>Unit Status:</strong><br>
Personnel: 120 / 140<br>
Vehicles FMC: 85%<br>
Weapons: 100%
</div>

<div id="slides"></div>
</div>

<template id="template">
<div class="slide">

<div class="col">
<div contenteditable="false" class="editable">Mission</div>
<div contenteditable="false" class="editable">Intent</div>
</div>

<div class="col">
<div class="map">
<img src="https://via.placeholder.com/800x400" class="img">
<input type="file" onchange="uploadImg(event,this)">
</div>

<!-- TIMELINE BUILDER -->
<div>
<input type="time" id="time">
<input type="text" id="task">
<button onclick="addTimeline(this)">Add</button>
<ul class="timeline"></ul>
</div>

</div>

<div class="col">
<div contenteditable="false" class="editable">CONOP</div>
</div>

</div>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
let count=0
let edit=false

function addMission(name="Mission"){
count++
let id="m"+count

let tab=document.createElement('div')
tab.className='mission-tab'

let text=document.createElement('span')
text.innerText=name
text.contentEditable=true

let status=document.createElement('div')
status.className='status-dot green'
status.onclick=()=>{
status.className=status.classList.contains('green')?'status-dot amber':status.classList.contains('amber')?'status-dot red':'status-dot green'
}

tab.appendChild(text)
tab.appendChild(status)

tab.onclick=()=>switchMission(id,tab)

document.getElementById('tabs').appendChild(tab)

let temp=document.getElementById('template').content.cloneNode(true)
let slide=temp.querySelector('.slide')
slide.id=id

document.getElementById('slides').appendChild(slide)

switchMission(id,tab)
}

function switchMission(id,tab){
document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'))
document.querySelectorAll('.mission-tab').forEach(t=>t.classList.remove('active'))

document.getElementById(id).classList.add('active')
tab.classList.add('active')
}

function toggleEdit(){
edit=!edit

document.querySelectorAll('.editable').forEach(e=>e.contentEditable=edit)
}

function toggleFullscreen(){
document.body.classList.toggle('fullscreen')
}

function uploadImg(e,input){
let file=e.target.files[0]
let reader=new FileReader()
reader.onload=r=>{
input.previousElementSibling.src=r.target.result
}
reader.readAsDataURL(file)
}

// TIMELINE SORT
function addTimeline(btn){
let container=btn.parentElement
let time=container.querySelector('#time').value
let task=container.querySelector('#task').value

let li=document.createElement('li')
li.dataset.time=time
li.innerText=time+" - "+task

let ul=container.querySelector('.timeline')
ul.appendChild(li)

// SORT
let items=[...ul.children]
items.sort((a,b)=>a.dataset.time.localeCompare(b.dataset.time))
ul.innerHTML=''
items.forEach(i=>ul.appendChild(i))
}

// PDF EXPORT
function exportPDF(){
let element=document.querySelector('.slide.active')
html2pdf().from(element).save("CONOP.pdf")
}

window.onload=()=>{
addMission("EPFA")
addMission("AFT")
}
</script>

</body>
</html>
