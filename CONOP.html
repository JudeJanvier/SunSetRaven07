<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOC | CONOP DASHBOARD</title>

<style>
:root {
  --bg:#0a0c0e;
  --panel:#111827;
  --card:#0f1720;
  --border:#2b3440;
  --accent:#d4af37;
  --text:#c9d1d9;
}

*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI, monospace;background:var(--bg);color:var(--text);display:grid;grid-template-columns:280px 1fr;height:100vh}

.sidebar{background:#0f172a;border-right:2px solid var(--border);padding:15px}
.mission-tab{border:1px solid var(--border);padding:10px;margin-bottom:6px;cursor:pointer}
.mission-tab.active{border-color:var(--accent);background:rgba(212,175,55,0.1)}

.main{padding:15px;overflow:auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.title{font-size:1.6rem;border:1px solid var(--accent);padding:6px 15px}

.slide{display:none;grid-template-columns:25% 50% 25%;gap:12px}
.slide.active{display:grid}

.section{
  border:1px solid var(--border);
  background:var(--card);
  padding:10px;
}
.section-title{
  color:var(--accent);
  font-size:0.8rem;
  border-bottom:1px solid var(--border);
  margin-bottom:6px;
  padding-bottom:4px;
}

.box{
  background:#1a2230;
  border:1px solid var(--accent);
  padding:8px;
}

.left,.right{display:flex;flex-direction:column;gap:10px}

.center{display:flex;flex-direction:column;gap:10px}

.map{
  height:300px;
  border:2px dashed var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
.map img{width:100%;height:100%;object-fit:contain}

.timeline{
  border:1px solid var(--border);
  padding:10px;
  background:#0d1117;
}

button{background:#111827;border:1px solid var(--border);color:white;padding:6px 10px;cursor:pointer}

.editing [contenteditable="true"]{outline:1px dashed var(--accent)}

</style>
</head>

<body>

<div class="sidebar">
  <div id="tabs"></div>
  <button onclick="addMission()">+ Add Mission</button>
</div>

<div class="main">
  <div class="header">
    <div>LOGO</div>
    <div class="title" contenteditable="true">CONOP TITLE</div>
    <div>DTG / LOCATION</div>
  </div>

  <button onclick="toggleEdit()">Edit Mode</button>

  <div id="slides"></div>
</div>

<template id="template">
<div class="slide">

<div class="left">

<div class="section">
<div class="section-title">MISSION STATEMENT</div>
<div class="box editable" contenteditable="false">Type mission...</div>
</div>

<div class="section">
<div class="section-title">COMMANDER'S INTENT</div>
<div class="box editable" contenteditable="false">Type intent...</div>
</div>

<div class="section">
<div class="section-title">KEY TASKS</div>
<div class="box editable" contenteditable="false">
• Task 1<br>• Task 2
</div>
</div>

<button onclick="addCustomSection(this)">+ Add Section</button>

</div>

<div class="center">

<div class="map" onclick="upload.click()">
<span>CLICK TO UPLOAD MAP</span>
<img class="img">
<input type="file" id="upload" hidden onchange="uploadImg(event,this)">
</div>

<div class="timeline">
<div class="section-title">OPERATIONAL TIMELINE</div>
<div class="timeline-list editable" contenteditable="false">
0230 First Formation<br>
0300 SP<br>
0430 Start
</div>
<div style="margin-top:8px; display:flex; gap:6px; flex-wrap:wrap;">
<input type="time" class="time-input">
<input type="text" class="task-input" placeholder="Task">
<button onclick="addTimelineItem(this)">Add</button>
</div>
</div>

</div>

<div class="right">

<div class="section">
<div class="section-title">CONCEPT OF OPERATIONS</div>
<div class="box editable" contenteditable="false">
Phase I<br>Phase II
</div>
</div>

<div class="section">
<div class="section-title">UNIFORM / WEATHER</div>
<div class="box editable" contenteditable="false">
OCP<br>Temp info
</div>
</div>

<div class="section">
<div class="section-title">KEY PERSONNEL</div>
<div class="box editable" contenteditable="false">
NCOIC / OIC
</div>
</div>

<button onclick="addRightSection(this)">+ Add Section</button>

</div>

</div>

</div>
</template>

<script>
let count=0
let edit=false

function addMission(name="Mission"){
count++
let id="m"+count

let tab=document.createElement('div')
tab.className='mission-tab'
tab.innerText=name

tab.onclick=()=>switchMission(id,tab)
document.getElementById('tabs').appendChild(tab)

let temp=document.getElementById('template').content.cloneNode(true)
let slide=temp.querySelector('.slide')
slide.id=id

document.getElementById('slides').appendChild(slide)

switchMission(id,tab)
}

function switchMission(id,tab){
document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'))
document.querySelectorAll('.mission-tab').forEach(t=>t.classList.remove('active'))

document.getElementById(id).classList.add('active')
tab.classList.add('active')
}

function toggleEdit(){
edit=!edit

document.querySelectorAll('.editable').forEach(e=>e.contentEditable=edit)
}

function uploadImg(e,input){
let file=e.target.files[0]
let reader=new FileReader()
reader.onload=r=>{
input.previousElementSibling.src=r.target.result
}
reader.readAsDataURL(file)
}

function addCustomSection(btn){
const container=btn.parentElement

const section=document.createElement('div')
section.className='section'
section.innerHTML=`
<div class="section-title" contenteditable="true">NEW SECTION</div>
<div class="box editable" contenteditable="true">Type...</div>
`

container.insertBefore(section,btn)
}

// 🔥 RIGHT SIDE SECTION ADDER
function addRightSection(btn){
const container=btn.parentElement

const section=document.createElement('div')
section.className='section'
section.innerHTML=`
<div class="section-title" contenteditable="true">NEW SECTION</div>
<div class="box editable" contenteditable="true">Type...</div>
`

container.insertBefore(section,btn)
}

// 🔥 TIMELINE BUILDER
function addTimelineItem(btn){
const container = btn.closest('.timeline')
const time = container.querySelector('.time-input').value
const task = container.querySelector('.task-input').value

if(!time || !task) return

const list = container.querySelector('.timeline-list')

let items = list.innerHTML.split('<br>').filter(i=>i.trim()!=="")
items.push(`${time} ${task}`)

// SORT
items.sort((a,b)=>a.localeCompare(b))

list.innerHTML = items.join('<br>')

container.querySelector('.time-input').value=""
container.querySelector('.task-input').value=""
}

window.onload=()=>{
addMission('EPFA')
addMission('AFT')
}
</script>

</body>
</html>
