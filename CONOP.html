<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOC | BATTLE COMMAND CENTER</title>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --card: rgba(22, 27, 34, 0.7);
            --border: #30363d;
            --accent: #d4af37; /* Tactical Gold */
            --army-green: #4b5320;
            --text: #c9d1d9;
            --danger: #f85149;
            --success: #3fb950;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }
        
        body {
            margin: 0;
            font-family: 'Segoe UI', 'Roboto', monospace;
            background: var(--bg);
            color: var(--text);
            display: grid;
            grid-template-columns: 260px 1fr;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR STYLING */
        .sidebar {
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-header {
            font-weight: bold;
            font-size: 0.8rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .mission-tab {
            border: 1px solid var(--border);
            padding: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.02);
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }

        .mission-tab:hover { background: rgba(212, 175, 55, 0.05); border-color: var(--accent); }
        .mission-tab.active { 
            border-color: var(--accent); 
            background: rgba(212, 175, 55, 0.1); 
            box-shadow: inset 4px 0 0 var(--accent);
        }

        /* MAIN CONTENT */
        .main { padding: 0; display: flex; flex-direction: column; height: 100vh; }

        .classification-banner {
            background: var(--danger);
            color: white;
            text-align: center;
            font-weight: bold;
            padding: 4px;
            font-size: 0.7rem;
            letter-spacing: 3px;
        }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--panel);
            border-bottom: 1px solid var(--border);
        }

        .title-area h1 {
            margin: 0;
            font-size: 1.4rem;
            color: white;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        /* GRID SYSTEM */
        .content-body { padding: 20px; overflow-y: auto; flex-grow: 1; }
        
        .slide { display: none; grid-template-columns: 300px 1fr 300px; gap: 15px; }
        .slide.active { display: grid; }

        /* COMPONENT CARDS */
        .section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }

        .section-title {
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .box { font-size: 0.9rem; line-height: 1.6; color: #d1d5db; min-height: 40px; }

        /* MAP AREA */
        .map-wrapper {
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        .map-display {
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle, #1a2230 0%, #0a0c0e 100%);
        }

        .map-display img { width: 100%; height: 100%; object-fit: contain; }

        /* CONTROLS */
        .btn-tac {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 15px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .btn-tac:hover { border-color: var(--accent); color: var(--accent); }
        .btn-add { border-color: var(--success); color: var(--success); margin-top: 10px; width: 100%; }

        .editing [contenteditable="true"] { background: rgba(255,255,255,0.05); outline: 1px dashed var(--accent); padding: 5px; }

        .timeline-item {
            display: flex;
            gap: 15px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .time-tag { color: var(--accent); font-family: monospace; font-weight: bold; width: 60px; }
    </style>
</head>

<body>

<aside class="sidebar">
    <div class="sidebar-header">Unit Dashboard</div>
    <div id="tabs"></div>
    <button class="btn-tac btn-add" onclick="addMission()">+ New Mission</button>
</aside>

<main class="main">
    <div class="classification-banner">SECRET // NOFORN</div>
    
    <div class="top-nav">
        <div class="title-area">
            <h1 contenteditable="true" id="current-title">OPERATION BEST SQUAD</h1>
            <small style="color: var(--accent); font-family: monospace;">DTG: 081200MAY25 | LOC: GRAFENWOEHR, GE</small>
        </div>
        <div class="controls">
            <button class="btn-tac" onclick="toggleEdit()" id="edit-btn">Enter Create Mode</button>
        </div>
    </div>

    <div class="content-body" id="slides"></div>
</main>

<template id="template">
    <div class="slide">
        <div class="left"></div>
        
        <div class="center">
            <div class="map-wrapper">
                <div class="section-header" style="padding: 10px;">
                    <span class="section-title">Satellite Overlay / Graphics</span>
                    <div style="display:flex; gap:5px;">
                        <button class="btn-tac" onclick="triggerUpload(this)">Upload</button>
                        <button class="btn-tac" onclick="toggleMap(this)">Map</button>
                    </div>
                </div>
                <div class="map-display">
                    <img class="img-preview" src="https://via.placeholder.com/800x400/0d1117/d4af37?text=NO+IMAGE+DATA">
                    <input type="file" hidden onchange="uploadImg(event,this)">
                </div>
            </div>

            <div class="section" style="margin-top: 15px;">
                <div class="section-header">
                    <span class="section-title">Operational Timeline</span>
                </div>
                <div class="timeline-list editable" contenteditable="false"></div>
                <div class="timeline-form" style="margin-top:10px; display:flex; gap:10px;">
                    <input type="time" class="time-in" style="background:#000; border:1px solid var(--border); color:white;">
                    <input type="text" class="task-in" placeholder="Task Detail" style="background:#000; border:1px solid var(--border); color:white; flex-grow:1;">
                    <button class="btn-tac" onclick="addTimelineItem(this)">Add</button>
                </div>
            </div>
        </div>

        <div class="right"></div>
    </div>
</template>

<script>
let count=0, edit=false;

function createSection(title="SECTION HEADER", content="Data entry required..."){
    const section=document.createElement('div');
    section.className='section';
    section.innerHTML=`
        <div class="section-header">
            <span class="section-title" contenteditable="true">${title}</span>
            <span style="color:var(--danger); cursor:pointer;" onclick="this.closest('.section').remove()">×</span>
        </div>
        <div class="box editable" contenteditable="false">${content}</div>`;
    return section;
}

function addMission(name="New Mission"){
    count++;
    let id="m"+count;
    let tab=document.createElement('div');
    tab.className='mission-tab';
    tab.innerHTML=`<span>${name}</span><small>#${count}</small>`;
    tab.onclick=()=>switchMission(id,tab);
    document.getElementById('tabs').appendChild(tab);

    let temp=document.getElementById('template').content.cloneNode(true);
    let slide=temp.querySelector('.slide');
    slide.id=id;

    // PRE-LOAD WITH BEST SQUAD DATA
    let left=slide.querySelector('.left');
    left.appendChild(createSection("Mission Statement","21st STB conducts Best Squad Competition from 18-24 APR 2026."));
    left.appendChild(createSection("Commander's Intent","Identify the STB's Best Squad while enforcing FM 7-22 standards."));

    let right=slide.querySelector('.right');
    right.appendChild(createSection("Concept of Operations","Phase I: Preparation\nPhase II: Execution\nPhase III: Recovery"));
    right.appendChild(createSection("Key Personnel","OIC: CPT Evans\nNCOIC: SFC Smith"));

    document.getElementById('slides').appendChild(slide);
    switchMission(id,tab);
}

function switchMission(id,tab){
    document.querySelectorAll('.slide').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('.mission-tab').forEach(t=>t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    tab.classList.add('active');
    document.getElementById('current-title').innerText = tab.querySelector('span').innerText;
}

function toggleEdit(){
    edit=!edit;
    document.body.classList.toggle('editing', edit);
    document.querySelectorAll('.editable').forEach(e=>e.contentEditable=edit);
    document.getElementById('edit-btn').innerText = edit ? "Save & Lock Brief" : "Enter Create Mode";
    document.getElementById('edit-btn').style.borderColor = edit ? "var(--success)" : "var(--border)";
}

function triggerUpload(btn){
    btn.closest('.map-wrapper').querySelector('input[type="file"]').click();
}

function uploadImg(e,input){
    let file=e.target.files[0];
    if(file){
        let reader=new FileReader();
        reader.onload=r=>{ input.closest('.map-wrapper').querySelector('.img-preview').src=r.target.result; }
        reader.readAsDataURL(file);
    }
}

function addTimelineItem(btn){
    const container = btn.closest('.section');
    const time = container.querySelector('.time-in').value;
    const task = container.querySelector('.task-in').value;
    if(!time || !task) return;

    const list = container.querySelector('.timeline-list');
    list.innerHTML += `<div class="timeline-item"><span class="time-tag">${time}</span><span>${task}</span></div>`;
    container.querySelector('.time-in').value="";
    container.querySelector('.task-in').value="";
}

window.onload=()=>{
    addMission('EPFA');
    addMission('AFT');
}
</script>
</body>
</html>
